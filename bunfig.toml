[test]
root = "./test"
coverageSkipTestFiles = true
coverageThreshold = { lines = 0.95, functions = 0.95 }
coveragePathIgnorePatterns = [
  "**/dist/**",
  "**/node_modules/**",
  "**/test/**",
  "**/scripts/**",
  "**/*.d.ts",
]

[fmt]
printWidth = 100
tabWidth = 2
useTabs = false
semi = false
singleQuote = true
trailingComma = "all"
