name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published GitHub release tag for qualification or npm recovery
        default: ''
        type: string
      dry_run:
        description: Qualify without publishing
        default: true
        required: true
        type: boolean

permissions: {}
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  qualify:
    needs: release
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || needs.release.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.archive.outputs.publish }}
      path: ${{ steps.archive.outputs.path }}
      integrity: ${{ steps.archive.outputs.integrity }}
      tag: ${{ steps.archive.outputs.tag }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zenlev
          POSTGRES_PASSWORD: zenlev
          POSTGRES_DB: zenlev_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zenlev -d zenlev_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: zenlev
          MYSQL_DATABASE: zenlev_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pzenlev"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ZENLEV_TEST_POSTGRES_URL: postgresql://zenlev:zenlev@127.0.0.1:5432/zenlev_test
      ZENLEV_TEST_MYSQL_URL: mysql://root:zenlev@127.0.0.1:3306/zenlev_test
      RELEASE_TAG: ${{ inputs.release_tag || needs.release.outputs.tag_name }}
    steps:
      - name: Require a tag for publication recovery
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: test -n "$RELEASE_TAG"
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG && format('refs/tags/{0}', env.RELEASE_TAG) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Qualify documentation
        working-directory: website
        run: bun install --frozen-lockfile --ignore-scripts && bun run typecheck && bun run lint && bun run build && bun run verify:build
      - name: Verify exact release revision
        if: env.RELEASE_TAG != ''
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const {execFileSync}=require('node:child_process');
            const manifest=require(process.cwd()+'/package.json');
            const tag=process.env.RELEASE_TAG;
            if(tag!=='v'+manifest.version || manifest.name!=='@mwillbanks/zenstack-zenlev') throw Error('Release identity differs');
            const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
            if(git('rev-parse','HEAD')!==git('rev-parse',tag+'^{commit}')) throw Error('Checkout differs from tag');
            git('merge-base','--is-ancestor','HEAD','origin/main');
            const {data:release}=await github.rest.repos.getReleaseByTag({...context.repo,tag});
            if(release.draft || release.tag_name!==tag) throw Error('Expected a published GitHub release');
            const versions=require(process.cwd()+'/.release-please-manifest.json');
            if(versions['.']!==manifest.version) throw Error('Release Please manifest differs from the tagged package');
            const {existsSync,readFileSync}=require('node:fs');
            const entries=readFileSync('CHANGELOG.md','utf8').split(/\r?\n/);
            if(!entries.some(line=>line===`## [${manifest.version}]` || line.startsWith(`## [${manifest.version}] - `))) throw Error('Missing authored changelog entry');
            if(!existsSync(`website/content/docs/releases/${manifest.version}.mdx`)) throw Error('Missing authored documentation release notes');
      - run: bun run verify:coverage
      - run: bun run build
      - run: bun run pack:check --output release-artifacts
      - name: Check registry integrity
        id: archive
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs=require('node:fs');
            const {createHash}=require('node:crypto');
            const manifest=require(process.cwd()+'/package.json');
            const files=fs.readdirSync('release-artifacts').filter(name=>name.endsWith('.tgz'));
            if(files.length!==1) throw Error('Expected exactly one qualified tarball');
            const path='release-artifacts/'+files[0];
            const integrity='sha512-'+createHash('sha512').update(fs.readFileSync(path)).digest('base64');
            const response=await fetch('https://registry.npmjs.org/'+encodeURIComponent(manifest.name)+'/'+manifest.version);
            if(!response.ok && response.status!==404) throw Error('Registry lookup failed: '+response.status);
            if(response.ok) {
              const {dist}=await response.json();
              if(dist?.integrity!==integrity) throw Error('Published version differs from archive');
              if(!dist.attestations?.url) throw Error('Published version lacks npm attestations');
            }
            core.setOutput('publish',String(response.status===404));
            core.setOutput('path',files[0]);
            core.setOutput('integrity',integrity);
            core.setOutput('tag',manifest.version.includes('-')?'next':'latest');
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: qualified-release
          path: release-artifacts/*.tgz
          if-no-files-found: error

  publish:
    needs: qualify
    if: ${{ !cancelled() && needs.qualify.result == 'success' && needs.qualify.outputs.publish == 'true' && (github.event_name == 'push' || !inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: qualified-release
          path: release-artifacts
      - name: Publish qualified archive
        env:
          TARBALL: ./release-artifacts/${{ needs.qualify.outputs.path }}
          INTEGRITY: ${{ needs.qualify.outputs.integrity }}
          DIST_TAG: ${{ needs.qualify.outputs.tag }}
        run: |
          node <<'NODE'
          const {createHash}=require('node:crypto');
          const {readFileSync}=require('node:fs');
          const integrity='sha512-'+createHash('sha512').update(readFileSync(process.env.TARBALL)).digest('base64');
          if(integrity!==process.env.INTEGRITY) throw Error('Qualified tarball integrity differs');
          NODE
          npm publish "$TARBALL" --access public --provenance --ignore-scripts --tag "$DIST_TAG"
