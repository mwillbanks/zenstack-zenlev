name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Check scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.scope.outputs.package }}
      website: ${{ steps.scope.outputs.website }}
      templates: ${{ steps.scope.outputs.templates }}
      markdown: ${{ steps.scope.outputs.markdown }}
      skills: ${{ steps.scope.outputs.skills }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/check-scope.sh "$BASE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  skills:
    name: Agent skills
    needs: scope
    if: needs.scope.outputs.skills == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run skills:check
      - run: bun test test/skills.test.ts

  repository-lint:
    name: Repository files lint
    needs: scope
    if: needs.scope.outputs.templates == 'true' || needs.scope.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - if: needs.scope.outputs.templates == 'true'
        run: |
          bun fmt --check .github/ISSUE_TEMPLATE .github/scripts/lint-issue-templates.ts
          bun .github/scripts/lint-issue-templates.ts
      - if: needs.scope.outputs.markdown == 'true'
        run: git ls-files -z -- '*.md' ':!website/**' | xargs -0 bun fmt --check

  quality:
    needs: scope
    if: needs.scope.outputs.package == 'true'
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format:check
      - run: bun check
      - run: bun run lint

  package:
    name: Package on Linux
    needs: scope
    if: needs.scope.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: bun run pack:check

  dialects:
    name: Dialect integration and coverage
    needs: scope
    if: needs.scope.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zenlev
          POSTGRES_PASSWORD: zenlev
          POSTGRES_DB: zenlev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zenlev -d zenlev_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: zenlev
          MYSQL_DATABASE: zenlev_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pzenlev"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ZENLEV_TEST_POSTGRES_URL: postgresql://zenlev:zenlev@127.0.0.1:5432/zenlev_test
      ZENLEV_TEST_MYSQL_URL: mysql://root:zenlev@127.0.0.1:3306/zenlev_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:coverage
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  coverage-upload:
    name: Publish main coverage
    needs: [dialects, quality, package, skills, repository-lint]
    if: >-
      !cancelled() && !failure() && needs.dialects.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lcov
          path: coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true

  docs:
    name: Static documentation
    needs: scope
    if: needs.scope.outputs.website == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: website/package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - run: bun run verify:build
