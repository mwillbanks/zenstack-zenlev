name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format:check
      - run: bun check
      - run: bun run lint

  package:
    name: Package on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test
      - run: bun run build
      - run: bun run pack:check

  dialects:
    name: Dialect integration and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zenlev
          POSTGRES_PASSWORD: zenlev
          POSTGRES_DB: zenlev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zenlev -d zenlev_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: zenlev
          MYSQL_DATABASE: zenlev_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pzenlev"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ZENLEV_TEST_POSTGRES_URL: postgresql://zenlev:zenlev@127.0.0.1:5432/zenlev_test
      ZENLEV_TEST_MYSQL_URL: mysql://root:zenlev@127.0.0.1:3306/zenlev_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:coverage
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  docs:
    name: Static documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: website/package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - run: bun run verify:build
